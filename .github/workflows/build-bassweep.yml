
name: Build BassSweep APK

on:
  workflow_dispatch:
  push:
    paths:
      - BassSweep-Android-Projekt.zip
      - .github/workflows/build-bassweep.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          unzip -q BassSweep-Android-Projekt.zip -d source
          test -f source/BassSweep/app/build.gradle

      - name: Build APK
        working-directory: source/BassSweep
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BassSweep-debug
          path: source/BassSweep/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
